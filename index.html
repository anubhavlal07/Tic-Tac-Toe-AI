<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="theme-color" content="#2196F3">
  <meta name="description" content="Play Tic Tac Toe against an unbeatable AI with Material Design">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TicTacToe">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Tic Tac Toe - Material Design</title>
</head>

<body>
  <!-- Custom Game Modal -->
  <div class="modal-backdrop" id="choiceModal">
    <div class="game-modal">
      <h2 class="game-modal-title">Choose Your Player</h2>
      <p class="game-modal-subtitle">Select who will make the first move</p>
      <div class="player-selection">
        <div class="player-card" data-choice="human">
          <div class="player-icon">
            <span class="player-symbol">○</span>
          </div>
          <h3>You Start</h3>
          <p>Play as O</p>
        </div>
        <div class="vs-divider">vs</div>
        <div class="player-card" data-choice="ai">
          <div class="player-icon ai-icon">
            <span class="player-symbol">×</span>
          </div>
          <h3>AI Starts</h3>
          <p>AI plays as X</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Info Toast -->
  <div class="info-toast" id="infoToast">
    <div class="toast-content" id="infoMessage"></div>
  </div>

  <div class="container">
    <div class="header-controls">
      <div class="score-tracker">
        <div class="score-item">
          <span class="score-label">Wins</span>
          <span class="score-value" id="wins">0</span>
        </div>
        <div class="score-item">
          <span class="score-label">Ties</span>
          <span class="score-value" id="ties">0</span>
        </div>
        <div class="score-item">
          <span class="score-label">Losses</span>
          <span class="score-value" id="losses">0</span>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <span class="theme-icon">🌙</span>
      </button>
    </div>
    <h1 class="title">Tic <span>Tac</span> Toe</h1>
    <div class="end-game">
      <div class="text status-action"></div>
    </div>
    <div class="status-action">
      <div class="status"></div>
      <button class="reset">Reset</button>
    </div>
    <div class="game-grid">
      <div class="game-cell" id="0"></div>
      <div class="game-cell" id="1"></div>
      <div class="game-cell" id="2"></div>
      <div class="game-cell" id="3"></div>
      <div class="game-cell" id="4"></div>
      <div class="game-cell" id="5"></div>
      <div class="game-cell" id="6"></div>
      <div class="game-cell" id="7"></div>
      <div class="game-cell" id="8"></div>
    </div>
  </div>
  <script src="minimax_algo.js"></script>
  <script src="index.js"></script>
</body>

</html>
