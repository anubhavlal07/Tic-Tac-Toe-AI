<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111219" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Play Tic Tac Toe against a trap-setting AI that never loses">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TicTacToe">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <title>Tic Tac Toe</title>
</head>

<body>
  <!-- Custom Game Modal -->
  <div class="modal-backdrop" id="choiceModal">
    <div class="game-modal" role="dialog" aria-modal="true" aria-labelledby="choiceTitle">
      <span class="sheet-handle" aria-hidden="true"></span>
      <h2 class="game-modal-title" id="choiceTitle">Who goes first?</h2>
      <p class="game-modal-subtitle">The AI never loses. Make one slip and it will win.</p>
      <div class="player-selection">
        <button type="button" class="player-card" data-choice="human">
          <span class="player-icon"><span class="mark mark-o"></span></span>
          <span class="player-text">
            <span class="player-name">You start</span>
            <span class="player-hint">You play O</span>
          </span>
        </button>
        <div class="vs-divider">or</div>
        <button type="button" class="player-card" data-choice="ai">
          <span class="player-icon ai-icon"><span class="mark mark-x"></span></span>
          <span class="player-text">
            <span class="player-name">AI starts</span>
            <span class="player-hint">AI plays X</span>
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- Info Toast -->
  <div class="info-toast" id="infoToast" role="status" aria-live="polite">
    <div class="toast-content" id="infoMessage"></div>
  </div>

  <main class="container">
    <header class="topbar">
      <h1 class="title">Tic Tac Toe<span class="title-sub">versus the Trap AI</span></h1>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" aria-pressed="false">
        <span class="theme-icon" aria-hidden="true">
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </span>
      </button>
    </header>

    <section class="score-tracker" aria-label="Score">
      <div class="score-item score-win">
        <span class="score-label">Wins</span>
        <span class="score-value" id="wins">0</span>
      </div>
      <div class="score-item score-tie">
        <span class="score-label">Draws</span>
        <span class="score-value" id="ties">0</span>
      </div>
      <div class="score-item score-loss">
        <span class="score-label">Losses</span>
        <span class="score-value" id="losses">0</span>
      </div>
    </section>

    <div class="end-game">
      <div class="text"></div>
    </div>

    <section class="status-action" aria-live="polite">
      <div class="status"></div>
      <button class="reset" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7" />
          <path d="M3 4v5h5" />
        </svg>
        New game
      </button>
    </section>

    <section class="legend" aria-label="Players">
      <div class="legend-item"><span class="mark mark-o"></span><span>You</span></div>
      <div class="legend-item"><span class="mark mark-x"></span><span>AI</span></div>
      <p class="legend-note">Draws are the best a perfect player can get. One mistake and the AI wins.</p>
    </section>

    <div class="board">
      <div class="game-grid">
        <div class="game-cell" id="0"></div>
        <div class="game-cell" id="1"></div>
        <div class="game-cell" id="2"></div>
        <div class="game-cell" id="3"></div>
        <div class="game-cell" id="4"></div>
        <div class="game-cell" id="5"></div>
        <div class="game-cell" id="6"></div>
        <div class="game-cell" id="7"></div>
        <div class="game-cell" id="8"></div>
      </div>
    </div>
  </main>
  <script src="trap_ai.js"></script>
  <script src="minimax_algo.js"></script>
  <script src="index.js"></script>
</body>

</html>
